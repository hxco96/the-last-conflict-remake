<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TLCR 3D camera test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #e8e8e8; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#view { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; max-width: calc(100% - 24px); }
  #ui button { background: rgba(15,17,22,0.85); color: #ddd; border: 1px solid #3a3f4a; padding: 8px 12px; font: 600 14px system-ui, sans-serif; letter-spacing: 0.5px; cursor: pointer; }
  #ui button.on { border-color: #ffd36b; color: #ffd36b; background: rgba(42,36,20,0.9); }
  #stats { position: fixed; right: 12px; top: 56px; font: 12px ui-monospace, monospace; color: #9aa; background: rgba(0,0,0,0.5); padding: 4px 8px; z-index: 2; text-align: right; }
  #help { position: fixed; left: 12px; bottom: 12px; font-size: 12px; color: #aab; background: rgba(0,0,0,0.55); padding: 6px 10px; z-index: 2; max-width: calc(100% - 24px); line-height: 1.5; }
  #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; z-index: 2; display: none; pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
  #cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #cross::after { top: 6px; left: 0; height: 2px; width: 14px; }
  #flash { position: fixed; inset: 0; background: radial-gradient(circle at 50% 60%, rgba(255,210,120,0.25), transparent 60%); opacity: 0; pointer-events: none; z-index: 1; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 20px; letter-spacing: 2px; z-index: 3; background: #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <button data-mode="top">1 Top-down</button>
  <button data-mode="third">2 Third person</button>
  <button data-mode="first">3 First person</button>
  <button id="lightsBtn">L Lights: night</button>
</div>
<div id="stats"></div>
<div id="cross"></div>
<div id="flash"></div>
<div id="help">WASD move · mouse look/aim · click shoot · Shift run · 1/2/3 camera · L lights<br>Controller: left stick move · right stick look · R2 shoot · △ camera &nbsp;|&nbsp; Touch: left side move · right side look · tap right side to shoot</div>
<div id="loading">LOADING…</div>
<script type="module" src="./poc.js"></script>
</body>
</html>
